<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Feliz Cumpleaños Chechu!</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card" id="card">
    <div class="card-front">
      <div class="envelope">
        <div class="envelope-flap"></div>
        <p class="hint">Hacé click para abrir 💌</p>
      </div>
    </div>
    <div class="card-inside">
      <h1>¡Feliz Cumpleaños<br>Chechu! 🎉</h1>
      <div class="cake">
        <div class="candles">
          <div class="candle"><div class="flame"></div></div>
          <div class="candle"><div class="flame"></div></div>
          <div class="candle"><div class="flame"></div></div>
        </div>
        <div class="cake-top"></div>
        <div class="cake-bottom"></div>
      </div>
      <p class="message">Que este día esté lleno de alegría, risas y todo lo que te haga feliz. 🥳</p>
      <button id="confettiBtn">🎊 Lanzar confetti</button>
    </div>
  </div>
  <canvas id="confetti"></canvas>
  <script src="script.js"></script>
</body>
</html>
